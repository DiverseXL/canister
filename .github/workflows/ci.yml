---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      FALKORDB_HOST: "127.0.0.1"
      FALKORDB_PORT: "6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest -m "not falkordb"

      - name: python corpus/generator.py
        run: uv run python corpus/generator.py

      - name: scripts/index.py
        run: uv run python scripts/index.py

      - name: scripts/seed.py
        run: uv run python scripts/seed.py

      - name: Run integration tests
        run: uv run pytest -m falkordb

      # The restart check is not run in CI because service containers run without host Docker daemon access
      - name: scripts/verify.py --skip-restart
        run: uv run python scripts/verify.py --skip-restart
